<text x="642.9" y="270.0" font-size="12.5" font-weight="400" fill="#33261F" text-anchor="start" >attribute-specific losses</text>
<text x="232.0" y="288.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >losses: magnitude, location, extent, timing, field validity;</text>
