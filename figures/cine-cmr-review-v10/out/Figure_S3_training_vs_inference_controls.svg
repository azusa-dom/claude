<text x="380.6" y="270.0" font-size="12.5" font-weight="400" fill="#33261F" text-anchor="start" >same estimand</text>
<path d="M494.1 266.0 L497.0 268.9 L502.5 262.6" stroke="#4E7470" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
