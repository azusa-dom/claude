<text x="430.0" y="179.0" font-size="11.5" font-weight="400" fill="#6F625A" text-anchor="start" >no retraining</text>
<line x1="558.0" y1="158.0" x2="592.0" y2="158.0" stroke="#6F625A" stroke-width="1.2" />
<path d="M586.6 160.6 L592.0 158.0 L586.6 155.4" stroke="#6F625A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
