<svg xmlns="http://www.w3.org/2000/svg" width="538.583pt" height="340.654pt" viewBox="0 0 800 506" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<defs>
<linearGradient id="cellDirect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8D6449"/><stop offset="1" stop-color="#5B3E2E"/></linearGradient>
<pattern id="hatchInf" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#F8E0DA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#C0584A" stroke-width="2"/></pattern>
</defs>
<rect x="0.0" y="0.0" width="800.0" height="506.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.0" />
<g transform="translate(0,0)">
<text x="20.0" y="36.0" font-size="10.5" font-weight="700" fill="#8E857D" text-anchor="start" >A · Clinical need versus image physics</text>
<line x1="20.0" y1="42.0" x2="258.0" y2="42.0" stroke="#8E857D" stroke-width="1.2" />
<circle cx="28.0" cy="56.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="28.0" y="60.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >1</text>
<text x="42.0" y="60.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Regional function is a distinct</text>
<text x="42.0" y="74.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >measurement problem</text>
<text x="42.0" y="86.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Ejection fraction compresses 3-D deformation</text>
<text x="42.0" y="99.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >into a chamber ratio; compensation,</text>
<text x="42.0" y="112.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >cancellation and timing differences are</text>
<text x="42.0" y="125.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >hidden.</text>
<text x="258.0" y="139.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§1</text>
<circle cx="28.0" cy="165.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="28.0" y="169.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >2</text>
<text x="42.0" y="169.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Cine carries no material-point</text>
<text x="42.0" y="183.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >identity</text>
<text x="42.0" y="195.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Tagging imprints a pattern and DENSE</text>
<text x="42.0" y="208.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >encodes displacement in phase; bSSFP</text>
<text x="42.0" y="221.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >myocardium is homogeneous, so identity is</text>
<text x="42.0" y="234.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >not in the signal.</text>
<text x="258.0" y="248.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§2 · Fig. 2</text>
<line x1="28.0" y1="268.0" x2="28.0" y2="284.0" stroke="#33261F" stroke-width="1.1" />
<path d="M25.8 279.5 L28.0 284.0 L30.2 279.5" stroke="#33261F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38.0" y="280.0" font-size="10.5" font-weight="700" fill="#6F625A" text-anchor="start" font-style="italic" >Leap 1: physics → estimation</text>
<text x="20.0" y="308.0" font-size="10.5" font-weight="700" fill="#C0584A" text-anchor="start" >B · From physical gap to dependent number</text>
<line x1="20.0" y1="314.0" x2="258.0" y2="314.0" stroke="#C0584A" stroke-width="1.2" />
<circle cx="28.0" cy="328.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="28.0" y="332.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >3</text>
<text x="42.0" y="332.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Correspondence is inferred, and the</text>
<text x="42.0" y="346.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >prior selects</text>
<text x="42.0" y="358.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Many deformation fields fit the same images;</text>
<text x="42.0" y="371.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >smoothness, incompressibility, biomechanics</text>
<text x="42.0" y="384.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >or a training distribution picks one.</text>
<text x="258.0" y="398.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§2–3 · Fig. 1a · Table 1</text>
<circle cx="28.0" cy="424.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="28.0" y="428.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >4</text>
<text x="42.0" y="428.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >A reported value depends on three</text>
<text x="42.0" y="442.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >choices</text>
<text x="42.0" y="454.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Which estimator inferred it, how strain was</text>
<text x="42.0" y="467.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >defined, what it was validated against: ‘is cine</text>
<text x="42.0" y="480.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >FT regional strain accurate’ is incomplete.</text>
<text x="258.0" y="494.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§2</text>
<line x1="269.0" y1="6.0" x2="269.0" y2="502.0" stroke="#E8DFD6" stroke-width="0.8" />
<text x="280.0" y="36.0" font-size="10.5" font-weight="700" fill="#7A4720" text-anchor="start" >C · Evidence audit: what each endpoint supports</text>
<line x1="280.0" y1="42.0" x2="778.0" y2="42.0" stroke="#7A4720" stroke-width="1.2" />
<circle cx="288.0" cy="56.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="288.0" y="60.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >5</text>
<text x="302.0" y="60.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Boundary endpoints cannot confirm</text>
<text x="302.0" y="74.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >dense correspondence</text>
<text x="302.0" y="86.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Dice, surface distance, field regularity and</text>
<text x="302.0" y="99.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >sparse landmarks measure boundary</text>
<text x="302.0" y="112.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >geometry and sampled points; identical</text>
<text x="302.0" y="125.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >borders admit different interior motion.</text>
<text x="518.0" y="139.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§4 · Table 2</text>
<line x1="288.0" y1="159.0" x2="288.0" y2="175.0" stroke="#33261F" stroke-width="1.1" />
<path d="M285.8 170.5 L288.0 175.0 L290.2 170.5" stroke="#33261F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="298.0" y="171.0" font-size="10.5" font-weight="700" fill="#6F625A" text-anchor="start" font-style="italic" >Leap 2: reported endpoint → supported claim</text>
<circle cx="288.0" cy="191.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="288.0" y="195.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >6</text>
<text x="302.0" y="195.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Each validation target supports one</text>
<text x="302.0" y="209.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >claim and leaves one gap</text>
<text x="302.0" y="221.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Known motion, paired DENSE or tagging,</text>
<text x="302.0" y="234.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >scan–rescan, LGE, outcome; software,</text>
<text x="302.0" y="247.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >sampling, strain convention, statistical unit</text>
<text x="302.0" y="260.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >and reference uncertainty are stated before</text>
<text x="302.0" y="273.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >attribution.</text>
<text x="518.0" y="287.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§4–5 · Fig. 1b · Fig. 3</text>
<circle cx="288.0" cy="313.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="288.0" y="317.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >7</text>
<text x="302.0" y="317.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Paired studies support a threefold</text>
<text x="302.0" y="331.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >qualification</text>
<text x="302.0" y="343.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Circumferential strain, global or whole-slice</text>
<text x="302.0" y="356.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >mid-ventricular scale, matched definitions;</text>
<text x="302.0" y="369.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >agreement varies with component, scale and</text>
<text x="302.0" y="382.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >software, radial least.</text>
<text x="518.0" y="396.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§4 · Tables 2–3</text>
<line x1="529.0" y1="46.0" x2="529.0" y2="502.0" stroke="#E8DFD6" stroke-width="0.8" />
<circle cx="548.0" cy="56.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="548.0" y="60.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >8</text>
<text x="562.0" y="60.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >Focal attributes are rarely measured</text>
<text x="562.0" y="74.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >directly</text>
<text x="562.0" y="86.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Ranked by what already measures them:</text>
<text x="562.0" y="99.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >location and extent compete with LGE,</text>
<text x="562.0" y="112.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >magnitude has no direct competitor, timing</text>
<text x="562.0" y="125.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >has none and the least evidence.</text>
<text x="778.0" y="139.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >Fig. 4 · Table 3 · Fig. 5c</text>
<text x="540.0" y="173.0" font-size="10.5" font-weight="700" fill="#4E7470" text-anchor="start" >D · Engineering the claim</text>
<line x1="540.0" y1="179.0" x2="778.0" y2="179.0" stroke="#4E7470" stroke-width="1.2" />
<circle cx="548.0" cy="193.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="548.0" y="197.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >9</text>
<text x="562.0" y="197.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >A measurement contract makes the</text>
<text x="562.0" y="211.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >claim falsifiable</text>
<text x="562.0" y="223.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Acquisition, estimator, population, spatial unit,</text>
<text x="562.0" y="236.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >strain definition and reference state, time</text>
<text x="562.0" y="249.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >point, comparator, prespecified tolerance.</text>
<text x="778.0" y="263.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§6</text>
<circle cx="548.0" cy="289.0" r="8.0" fill="#FFFFFF" stroke="#33261F" stroke-width="1.3" />
<text x="548.0" y="293.0" font-size="11" font-weight="700" fill="#33261F" text-anchor="middle" >10</text>
<text x="562.0" y="293.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >No single agreement index validates</text>
<text x="562.0" y="307.0" font-size="12.0" font-weight="700" fill="#33261F" text-anchor="start" >all of it</text>
<text x="562.0" y="319.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Known motion: capacity and technical error.</text>
<text x="562.0" y="332.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >Paired material reference: material-sensitive</text>
<text x="562.0" y="345.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >agreement. Scan–rescan: precision. Tissue</text>
<text x="562.0" y="358.0" font-size="10.5" font-weight="400" fill="#6F625A" text-anchor="start" >and decisions: relevance and impact.</text>
<text x="778.0" y="372.0" font-size="10.5" font-weight="700" fill="#33261F" text-anchor="end" >§6 · Fig. 5 · Table 4</text>
</g>
</svg>